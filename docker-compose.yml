services:
  db:
    image: mysql:8.4
    container_name: eve-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3307:3306" # host 3307 to avoid clashing with a local MySQL
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Database dashboard -> http://localhost:8080
  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: eve-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy

  backend:
    build: ./backend
    container_name: eve-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}
      TOKEN_SIGNATURE: ${TOKEN_SIGNATURE}
      BEARER_KEY: ${BEARER_KEY}
      SALT_ROUND: ${SALT_ROUND}
      COHERE_API_KEY: ${COHERE_API_KEY}
      COHERE_MODEL: ${COHERE_MODEL:-command-a-03-2025}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://localhost}
      # Served by Caddy under /api on the same origin as the frontend.
      API_PATH_PREFIX: /api
      COOKIE_SAME_SITE: lax
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # Outgoing email (password resets). Unset: emails are printed to the backend log.
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-EVE <no-reply@eve.local>}
      # Public address of the app, used in email links.
      APP_URL: ${APP_URL:-https://localhost}
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Relative: the browser calls the API on whatever origin served the page (via Caddy).
        NEXT_PUBLIC_BASE_URL: /api
        # Same value the backend checks, so the two can't drift apart
        NEXT_PUBLIC_BEARER_KEY: ${BEARER_KEY}
    container_name: eve-frontend
    restart: unless-stopped
    depends_on:
      - backend

  # HTTPS entry point for the app -> https://localhost (see Caddyfile)
  caddy:
    image: caddy:2.10
    container_name: eve-caddy
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      HTTP_PORT: ${HTTP_PORT:-80}
      HTTPS_PORT: ${HTTPS_PORT:-443}
    ports:
      - "${HTTP_PORT:-80}:${HTTP_PORT:-80}"
      - "${HTTPS_PORT:-443}:${HTTPS_PORT:-443}"
      - "${HTTPS_PORT:-443}:${HTTPS_PORT:-443}/udp" # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and Caddy's local CA; keep this volume so they survive restarts.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  db_data:
  uploads:
  caddy_data:
  caddy_config:
