# Development override: the frontend runs `next dev` and the backend `tsx watch` on your
# source folders, so edits take effect right away (no rebuild).
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# Go back to the production build with: docker compose up -d --build
#
# Open the app at https://localhost (through Caddy). The frontend and backend ports
# are also published for debugging, but the app itself only works through Caddy.
services:
  # Runs from your source folder with `tsx watch`: saving a file restarts the server (no rebuild).
  backend:
    build: !reset null
    image: node:20-bookworm-slim
    working_dir: /app
    # Installs dependencies into a volume (quick when nothing changed), then starts the watcher.
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    environment:
      NODE_ENV: development
      # Every email the app sends lands in Mailpit -> http://localhost:8025
      SMTP_URL: smtp://mailpit:1025
    volumes:
      - ./backend:/app
      # Kept inside Docker so it doesn't clash with node_modules on your machine.
      - backend_node_modules:/app/node_modules
      - uploads:/app/uploads
    ports:
      - "5000:5000"

  mailpit:
    image: axllent/mailpit:v1.27
    container_name: eve-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"

  frontend:
    build: !reset null
    image: node:20-bookworm-slim
    working_dir: /app
    # Installs dependencies into a volume (first start takes a few minutes), then starts the dev server.
    command: >
      sh -c "corepack enable && corepack prepare pnpm@9.15.9 --activate &&
             pnpm install --frozen-lockfile &&
             pnpm dev --hostname 0.0.0.0 --port 3000"
    environment:
      NEXT_PUBLIC_BASE_URL: /api
      NEXT_PUBLIC_BEARER_KEY: ${BEARER_KEY}
      NEXT_TELEMETRY_DISABLED: 1
      # Set to "true" if changes aren't picked up (e.g. project on a Windows drive under /mnt/c).
      WATCHPACK_POLLING: ${WATCHPACK_POLLING:-false}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      # Kept inside Docker so they don't clash with node_modules/.next on your machine.
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next

volumes:
  backend_node_modules:
  frontend_node_modules:
  frontend_next:
